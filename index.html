<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Schuster · Plataforma interna (MVP)</title>

  <!-- ===================================================================== -->
  <!-- 1. LIBRERÍAS EXTERNAS (Supabase y Firebase SDKs)                       -->
  <!-- ===================================================================== -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <!-- ===================================================================== -->
  <!-- 2. ESTILOS CSS GENERALES Y DISEÑO VISUAL                              -->
  <!-- ===================================================================== -->
  <style>
    /* 2.1 Variables de color y temas (Claro / Oscuro) */
    :root {
      --bg: #fff;
      --fg: #000;
      --g1: #f5f5f5;
      --g2: #e4e4e4;
      --g3: #8f8f8f;
      --g4: #555;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media(prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #000;
        --fg: #fff;
        --g1: #141414;
        --g2: #2b2b2b;
        --g3: #7a7a7a;
        --g4: #bdbdbd;
      }
    }
    :root[data-theme="dark"] {
      --bg: #000;
      --fg: #fff;
      --g1: #141414;
      --g2: #2b2b2b;
      --g3: #7a7a7a;
      --g4: #bdbdbd;
    }

    /* 2.2 Configuración base y tipografías */
    html { scroll-padding-top: env(safe-area-inset-top, 0px); }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 17px/1.55 "Helvetica Neue", Arial, sans-serif;
    }
    h1, h2, h3, .brand {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
      margin: 0;
    }
    h1 { font-size: 34px; line-height: 1.2; }
    h2 { font-size: 23px; }
    button, select, input, textarea { font: inherit; color: var(--fg); }
    button { cursor: pointer; }
    .mut { color: var(--g4); font-size: 15px; }

    /* 2.3 Estructura de la Interfaz (Shell y Sidebar) */
    .shell { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
    .side {
      background: var(--g1);
      border-right: 1px solid var(--g2);
      padding: 24px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 260px;
    }
    .brand { font-size: 26px; padding: 0 10px; }
    .side .mut { padding: 0 10px 18px; }
    .nv {
      text-align: left;
      background: none;
      border: 0;
      padding: 13px 14px;
      border-radius: 8px;
      font-size: 17px;
    }
    .nv:hover { background: var(--g2); }
    .nv.on { background: var(--fg); color: var(--bg); }
    .sep { font-size: 12px; color: var(--g3); padding: 16px 10px 4px; }

    /* 2.4 Barra Superior, Buscador y Perfil */
    .top {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 5;
      background: var(--bg);
      border-bottom: 1px solid var(--g2);
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 12px 32px;
      flex-wrap: wrap;
    }
    .sw { position: relative; flex: 1; min-width: 220px; max-width: 460px; }
    .ac { position: relative; }
    .sw input { width: 100%; padding: 10px 14px; border: 1px solid var(--g3); border-radius: 8px; background: var(--bg); }
    .sr {
      position: absolute;
      left: 0;
      right: 0;
      top: 44px;
      background: var(--bg);
      border: 1px solid var(--fg);
      border-radius: 8px;
      z-index: 9;
      max-height: 380px;
      overflow: auto;
    }
    .sr:empty { display: none; }
    .hit {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      text-align: left;
      background: none;
      border: 0;
      border-bottom: 1px solid var(--g2);
      padding: 10px 14px;
    }
    .hit:hover { background: var(--g1); }
    .sr .mut { padding: 8px 14px; display: block; }

    /* 2.5 Contenido de Páginas y Pestañas */
    .pg { padding: 28px 32px 60px; max-width: 1240px; }
    .ub { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 26px; }
    .ub .lbl { font-weight: 600; font-size: 15px; }
    .seg { display: flex; flex-wrap: wrap; border: 1px solid var(--fg); border-radius: 8px; overflow: hidden; }
    .seg button { padding: 13px 20px; background: var(--bg); border: 0; border-right: 1px solid var(--g2); font-size: 16px; }
    .seg button.on { background: var(--fg); color: var(--bg); }
    .hd { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }

    /* 2.6 Botones, Tarjetas, Paneles y Grillas */
    .btn {
      background: var(--fg);
      color: var(--bg);
      border: 1px solid var(--fg);
      padding: 11px 22px;
      border-radius: 8px;
      min-height: 46px;
      font-size: 16px;
      font-weight: 600;
    }
    .btn.o { background: var(--bg); color: var(--fg); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .ln { background: none; border: 0; text-decoration: underline; padding: 6px; }
    .chip { display: inline-block; border: 1px solid var(--g3); border-radius: 99px; padding: 4px 14px; font-size: 15px; margin-right: 8px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; margin-bottom: 28px; }
    .card {
      text-align: left;
      background: var(--g1);
      border: 1px solid var(--g2);
      border-radius: 12px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .card:hover { border-color: var(--fg); }
    .card .mut:first-child { font-size: 16px; color: var(--fg); font-weight: 600; }
    .big { font: 400 46px/1.1 Georgia, serif; }
    .two { display: grid; grid-template-columns: 1.6fr 1fr; gap: 24px; }
    .pan { border: 1px solid var(--g2); border-radius: 12px; padding: 20px; }
    .pan h2 { margin-bottom: 12px; }
    .li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-top: 1px solid var(--g2);
      cursor: pointer;
      width: 100%;
      background: none;
      border-left: 0; border-right: 0; border-bottom: 0;
      text-align: left;
    }
    .bar { height: 10px; background: var(--g2); border-radius: 5px; margin: 4px 0 14px; }
    .bar i { display: block; height: 100%; background: var(--fg); border-radius: 5px; }
    .bar.d i { background: var(--g3); }

    /* 2.7 Tablas, Filtros y Formularios */
    .flt { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 16px; }
    .flt label, .fm label { display: flex; flex-direction: column; font-size: 15px; color: var(--g4); gap: 3px; }
    .flt select, .flt input, .fm input, .fm select, .fm textarea, .lg input, .mx select {
      min-height: 44px;
      font-size: 16px;
      padding: 10px 12px;
      border: 1px solid var(--g3);
      border-radius: 8px;
      background: var(--bg);
      width: 100%;
    }
    .tw { overflow-x: auto; border: 1px solid var(--g2); border-radius: 12px; }
    table { border-collapse: collapse; width: 100%; min-width: 720px; }
    th { text-align: left; font-size: 14px; color: var(--g4); font-weight: 600; background: var(--g1); padding: 12px 14px; }
    td { padding: 14px; border-top: 1px solid var(--g2); vertical-align: top; font-size: 16px; }
    tr[data-a] { cursor: pointer; }
    tr[data-a]:hover td { background: var(--g1); }

    /* 2.8 Badges y Estados Visuales */
    .b { display: inline-block; border-radius: 99px; padding: 3px 10px; font-size: 14px; margin: 0 4px 2px 0; white-space: nowrap; font-weight: 600; }
    .b1 { background: var(--g2); }
    .b2 { border: 1px solid var(--fg); }
    .b3 { background: var(--fg); color: var(--bg); }
    .bu { border: 1px dashed var(--g3); color: var(--g4); }
    :root { --gb: #d9f2df; --gf: #12551f; --rb: #fbdcdc; --rf: #8a1212; --yb: #fdf0b8; --yf: #6b4e00; }
    @media(prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --gb: #0f3a1a; --gf: #bff0c9; --rb: #4a1111; --rf: #ffc9c9; --yb: #4a3a05; --yf: #fbe58a; }
    }
    :root[data-theme="dark"] { --gb: #0f3a1a; --gf: #bff0c9; --rb: #4a1111; --rf: #ffc9c9; --yb: #4a3a05; --yf: #fbe58a; }
    .b.st-g { background: var(--gb); color: var(--gf); }
    .b.st-r { background: var(--rb); color: var(--rf); }
    .b.st-y { background: var(--yb); color: var(--yf); }
    .st-g::before, .st-r::before, .st-y::before { content: "● "; font-size: 10px; }

    /* 2.9 Modales, Paneles Laterales y Componentes de Usuario */
    .empty { border: 1px dashed var(--g3); border-radius: 12px; padding: 40px; text-align: center; color: var(--g4); }
    .mo { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; justify-content: flex-end; z-index: 20; }
    .dr { background: var(--bg); width: min(560px, 100%); height: 100%; overflow: auto; padding: 28px; padding-top: calc(28px + env(safe-area-inset-top, 0px)); }
    .dr dl { display: grid; grid-template-columns: 150px 1fr; gap: 12px 14px; margin: 20px 0; }
    .dr dt { color: var(--g4); font-size: 15px; }
    .dr dd { margin: 0; }
    .upd { background: var(--g1); border: 1px solid var(--g2); border-radius: 10px; padding: 12px 14px; font-weight: 600; }
    .fm label { display: block; font-size: 15px; color: var(--g4); margin-bottom: 12px; }
    .mx select { padding: 7px; border: 1px solid var(--g3); border-radius: 8px; background: var(--bg); width: 100%; }
    .mx select.l2 { background: var(--fg); color: var(--bg); }
    .mx select.l1 { background: var(--g2); }
    .mx select.l0 { color: var(--g4); border-style: dashed; }
    .mx th, .mx td { min-width: 130px; }
    .mx td:first-child, .mx th:first-child { min-width: 110px; font-weight: 600; }
    .warn { border: 1px solid var(--fg); border-radius: 10px; padding: 12px 16px; margin: 14px 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .pf { margin-left: auto; position: relative; }
    .av { width: 48px; height: 48px; border-radius: 50%; background: var(--fg); color: var(--bg); border: 0; font-weight: 700; font-size: 17px; padding: 0; }
    .pm { position: absolute; right: 0; top: 58px; background: var(--bg); border: 1px solid var(--fg); border-radius: 12px; padding: 20px; width: 320px; z-index: 30; }
    .pm dl { display: grid; grid-template-columns: 84px 1fr; gap: 8px; margin: 14px 0; }
    .pm dt { color: var(--g4); }
    .pm dd { margin: 0; }
    .lr { display: grid; grid-template-columns: 1fr 110px auto; gap: 8px; margin-bottom: 8px; }
    .lr .btn { min-height: 44px; }
    .sh { font: 400 21px Georgia, serif; margin: 24px 0 10px; }
    .dr .tw table { min-width: 0; }
    .dr .li { padding: 12px 0; align-items: center; }

    /* 2.10 Pantalla de Inicio de Sesión / Registro */
    .lgw { display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; }
    .lgl { background: #000; color: #fff; padding: 56px; display: flex; flex-direction: column; justify-content: space-between; }
    .lgl .brand { font-size: 44px; padding: 0; }
    .lgl p { font-family: Georgia, serif; font-size: 26px; max-width: 380px; margin: 0; }
    .lg { padding: 56px; max-width: 480px; align-self: center; width: 100%; }
    .lg label { display: block; margin: 14px 0 4px; font-size: 13px; }
    .lg .btn { width: 100%; margin-top: 18px; padding: 12px; }
    .err { color: var(--fg); border: 1px solid var(--fg); border-radius: 8px; padding: 8px 12px; margin-top: 12px; }
    .lgc { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .lgc .lg { padding: 0; max-width: 380px; }
    .lgc .brand { font-size: 44px; padding: 0; display: block; text-align: center; margin-bottom: 28px; }
    .lgc .ln { display: block; margin: 14px auto 0; }
    .ok { border: 1px solid var(--g3); background: var(--g1); border-radius: 8px; padding: 8px 12px; margin-top: 12px; }
    .cf { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 40; padding: 16px; }
    .cf > div { background: var(--bg); border-radius: 12px; padding: 24px; max-width: 380px; }
    .cf h2 { margin-bottom: 8px; }
    .mx select:disabled { opacity: .5; }

    /* 2.11 Elementos Responsive y Menú Móvil (Hamburguesa) */
    .hamb {
      display: none;
      background: none;
      border: 1px solid var(--g3);
      border-radius: 8px;
      width: 44px; height: 44px;
      min-height: 0; padding: 0;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; flex: 0 0 auto;
    }
    .hamb span { display: block; width: 20px; height: 2px; background: var(--fg); border-radius: 2px; }
    .tbrand { display: none; font: 400 20px Georgia, serif; white-space: nowrap; margin-right: 2px; }
    .side-bg { display: none; }

    @media(max-width: 900px) {
      html, body { overflow-x: hidden; }
      .shell { grid-template-columns: 1fr; position: relative; }
      main { min-width: 0; }
      .pg { min-width: 0; max-width: 100%; }
      .hamb { display: flex; }
      .tbrand { display: inline-block; }
      .side {
        position: fixed; top: 0; left: 0; bottom: 0;
        width: min(280px, 82vw);
        flex-direction: column; overflow-x: hidden; overflow-y: auto;
        transform: translateX(-100%); transition: transform .25s ease;
        z-index: 60; padding: 20px 14px;
        padding-top: calc(20px + env(safe-area-inset-top, 0px));
        padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        box-shadow: 2px 0 24px rgba(0,0,0,.25);
      }
      .side.open { transform: translateX(0); }
      .side .mut, .sep { display: block; }
      .side-bg.show { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 55; }
      .nv { white-space: normal; }
      .top { padding: 10px 14px; gap: 8px; }
      .pg { padding: 18px 14px 48px; }
      h1 { font-size: 24px; }
      h2 { font-size: 19px; }
      .big { font-size: 32px; }
      .sw { min-width: 0; flex: 1 1 auto; max-width: none; }
      .two { grid-template-columns: 1fr; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
      .card { padding: 14px; }
      .dr { width: 100%; padding: 20px 16px; padding-top: calc(20px + env(safe-area-inset-top, 0px)); }
      .dr dl { grid-template-columns: 1fr; gap: 2px 0; }
      .dr dt { margin-top: 12px; } .dr dt:first-child { margin-top: 0; }
      .pm { width: min(300px, calc(100vw - 32px)); right: 0; }
      .lgc { padding: 20px; } .lgc .lg { max-width: 100%; }
      .flt { gap: 10px; }
      .flt label { flex: 1 1 140px; }
      .lr { display: flex; flex-wrap: wrap; gap: 8px; }
      .lr select { flex: 1 1 100%; }
      .lr input { flex: 1 1 auto; min-width: 0; }
      .lr .btn { flex: 0 0 auto; }
      .seg { width: 100%; }
      .seg button { flex: 1 1 auto; text-align: center; }
      .hd { align-items: flex-start; }
      .two > *, .grid > * { min-width: 0; }
      img, svg { max-width: 100%; height: auto; }
      .mut, dd, .li, .pm, td, .chip, .upd, h1, h2, .card { overflow-wrap: anywhere; }
    }

    /* 2.12 Componentes especiales de Login (Contraseña y Recordarme) */
    .pwrap { position: relative; }
    .pwrap input { width: 100%; padding-right: 44px !important; }
    .eye {
      position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
      background: none; border: 0; padding: 8px; min-height: 0;
      display: flex; align-items: center; justify-content: center; color: var(--g4);
    }
    .eye:hover { color: var(--fg); }
    .remember, .lg label.remember { display: flex; align-items: center; gap: 10px; margin: 16px 0 0; cursor: pointer; }
    .remember input {
      -webkit-appearance: none; appearance: none; box-sizing: border-box;
      width: 18px; height: 18px; min-height: 0; margin: 0; padding: 0;
      border: 1px solid var(--g3); border-radius: 4px; background: var(--bg);
      flex: 0 0 auto; position: relative; cursor: pointer;
    }
    .remember input:checked { background: var(--fg); border-color: var(--fg); }
    .remember input:checked::after {
      content: ""; position: absolute; left: 5px; top: 2px; width: 5px; height: 9px;
      border: solid var(--bg); border-width: 0 2px 2px 0; transform: rotate(45deg);
    }
    .remember span { display: flex; align-items: center; height: 18px; font-size: 14px; line-height: 1; }
    .ac-list { top: calc(100% + 2px); }
    #toast {
      position: fixed; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      left: 50%; transform: translateX(-50%); background: #000; color: #fff;
      padding: 14px 24px; border-radius: 8px; display: none; z-index: 50; max-width: 90%; font-size: 17px;
    }
    @media(max-width: 480px) {
      .btn { padding: 10px 14px; font-size: 15px; }
      .grid { grid-template-columns: repeat(2, 1fr); }
      .chip { font-size: 13px; padding: 3px 10px; }
      td, th { padding: 10px; }
      .cf > div { padding: 18px; }
      .pm dl { grid-template-columns: 1fr; gap: 2px 0; }
      .pm dt { margin-top: 8px; } .pm dt:first-child { margin-top: 0; }
    }
  </style>
</head>

  <script>

    const TODAY = "2026-09-24", SN = { C: "Catering", M: "Mercado Gourmet", O: "Míos" }, UN = { all: "Todas", C: "Servicio de Catering", M: "Mercado Gourmet", O: "Salón de Eventos Míos" }, UO = ["C", "M", "O", "CM", "CO", "MO", "CMO"];

        if ($("#pt")) $("#pt").innerHTML = sumHTML(t.form);
        return;
      }
      if (d.f !== undefined) (S.fs[S.v] ??= {})[d.f] = t.value;
      else if (d.p) { if (!adm) return; const [m, r] = d.p.split("|"); D[m][r] = +t.value; }
      else if (d.u) { if (!adm) return; const [i, k] = d.u.split("|"); DU[i][k] = t.value; }
      else if (d.g) S[d.g] = t.value;
      else return;
      render();
    });

    document.addEventListener("input", e => {
      if (e.target.classList && e.target.classList.contains("ac-in")) {
        const box = e.target.closest(".ac"); box.querySelector("[name=p_cid]").value = "";

      }
      const f = e.target.form; if (f && f.id == "fm" && $("#pt")) $("#pt").innerHTML = sumHTML(f);
      if (e.target.id != "q") return; S.q = e.target.value; \$("#sr").innerHTML = sr();
      if (MK.includes(VM(S.v)) && perm(VM(S.v))) \$("#tb").innerHTML = tbl(VM(S.v), S.v);
    });

    document.addEventListener("focusin", e => {
      if (e.target.id == "q") \$("#sr").innerHTML = sr();
      if (e.target.classList && e.target.classList.contains("ac-in")) { const box = e.target.closest(".ac"), l = box.querySelector(".ac-list"); l.innerHTML = acListHTML(box.dataset.u, e.target.value); l.hidden = false; }
    });

    document.addEventListener("focusout", () => { if (S.stale) { S.stale = 0; setTimeout(remote, 80); } });

    document.addEventListener("submit", async e => {
      e.preventDefault(); const f = e.target, v = Object.fromEntries(new FormData(f));
      if (f.id == "lg") {
        await SY.boot; const em0 = String(v.e).trim().toLowerCase(), u = USERS.find(x => x.email == em0), ok = u && u.pwh == await hp(em0, v.p);
        if (ok && u.est != "activo") S.err = "Tu cuenta está pendiente de autorización. Gerencia debe habilitarla antes de que puedas ingresar.";
        else if (ok) {
          try { if (f.querySelector("[name=remember]").checked) localStorage.setItem("sch_remember_email", em0); else localStorage.removeItem("sch_remember_email"); } catch (e) {}
          Object.assign(S, { user: u, err: "", msg: "", v: "dash", unit: u.u.length > 1 ? "all" : u.u, q: "", fs: {}, o: null, del: null, showP1: false, showP2: false });
        } else S.err = "Email o contraseña incorrectos.";
        render();
      } else if (f.id == "rg") {
        const em = String(v.e).trim().toLowerCase(), n = String(v.n).trim(); let m = "";
        if (n.split(/\s+/).length < 2) m = "Ingresá nombre y apellido.";
        else if (!/^[a-z0-9._-]+@schuster\.com\.ar\$/.test(em)) m = "Usá tu email corporativo @schuster.com.ar.";
        else if (USERS.some(x => x.email == em)) m = "Ya existe una cuenta con ese email.";
        else if (v.p.length < 8) m = "La contraseña debe tener al menos 8 caracteres.";
        else if (v.p != v.p2) m = "Las contraseñas no coinciden.";
        if (m) { S.err = m; S.rv = { n, e: em }; }
        else { const u = { email: em, n, r: "", a: "", u: "", est: "pendiente", pwh: await hp(em, v.p), seq: Date.now() }; USERS.push(u); DU.push({ ...u }); pu(u); persist(); S.auth = "login"; S.err = ""; S.rv = null; S.msg = "Solicitud enviada. Tu cuenta quedó pendiente de autorización: Gerencia debe habilitarla y asignarte rol, área y unidades antes de que puedas ingresar."; }
        render();
      } else if (f.id == "fm") saveFm(f, v);
    });

    render();
    SY.boot = boot();
